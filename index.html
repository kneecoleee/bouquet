<script>

{src:"photo1.jpg",caption:"",date:"",note:""},
{src:"photo2.jpg",caption:"",date:"",note:""},
{src:"photo3.jpg",caption:"",date:"",note:""}],

letter:`hi, bubber!

i'm gonna be real honest with you, this was meant for our monthsary but i was a.) way too excited to show you this and b.) i wanted you to have this now.

first of all, congratulations on finishing urinetown, bubby! i really wish i could be there to see you take your bow (and lift), but even though i'm not there, i hope you know that i'm very proud of you and everything you've accomplished in this prod.
no one else could have done a better job and i'm sure everyone around you is grateful to have you around. i am endlessly proud of you bub.

pee pee town aside, i'm also proud of everything else you've done this semester including your defense, and the shoots, and all the editing you have to do at work or for guidon.
i'm amazed at how you were able to balance it all and excel in all these things on top of other duties you have to do. i was right, you really are supergirl. 

i have grown to love you more and more with every passing day. i can't wait to see you and hold you again, mahal. how privileged am i to be loved by you.

thank you for existing, and for giving me a chance to love you.

gihigugma tika, mahal kita, kaluguran daka, i love you.

from, spidey`};
const Q=new URLSearchParams(location.search);
["to","from","msg","note"].forEach(k=>{if(Q.get(k))CFG[k]=Q.get(k)});
if(Q.get("flowers"))CFG.flowers=+Q.get("flowers");
if(Q.get("pink"))CFG.pinkLilies=+Q.get("pink");
let sd=+Q.get("seed")||(Math.random()*1e9|0);
const R=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],$=i=>document.getElementById(i),PI=Math.PI;
const W=100,H=40,CW=9,CH=18,D=170,MID=15,SX=50,SY=17,STEM=18,BLOOM=12,FPS=14;
const GREENS=[[70,160,80],[110,190,100],[150,200,110],[90,140,70],[180,210,130]];
const PAL={carnation:[[255,105,150],[235,60,85],[245,235,242],[255,145,125],[220,90,170]],
lily:[[250,245,232],[255,150,55],[255,155,195],[255,222,90]],

const PINKLILY=[[255,155,195],[255,125,175],[255,190,215],[245,105,160]];
const SPK=[[255,105,140],[255,215,70],[240,240,250],[180,120,255],[120,200,255]],RIB=[230,90,130];
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const shade=(c,k)=>c.map(v=>cl(v*k|0,0,255)),mix=(a,b,t)=>a.map((v,i)=>v*(1-t)+b[i]*t|0);
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function bez(p0,p1,p2,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,a=(1-t)**2,b=2*(1-t)*t,c=t*t;o.push([0,1,2].map(k=>a*p0[k]+b*p1[k]+c*p2[k]))}return o}
function head(kind,Rr,color){const pts=[],st=.4,n=Math.floor((Rr+1)/st);
for(let iy=-n;iy<=n;iy++)for(let ix=-n;ix<=n;ix++){const u=ix*st,v=iy*st,d=Math.hypot(u,v);if(d>Rr+1)continue;
const a=Math.atan2(v,u),hq=Math.abs(Math.round(u*2)*7+Math.round(v*2)*13);let c=null;
if(kind=="carnation"){if(d<=Rr+.7*Math.sin(a*9)){const t=d/(Rr+1),i=hq%5;c=[(t>.45?"&%8@#":"@#&0%")[i],shade(color,.7+.35*(1-t)+.02*i)]}}
else if(kind=="lily"){const r=Rr*(.2+.8*Math.abs(Math.cos(3*a))**1.4);
if(d<.9)c=["@",[255,170,40]];else if(d<=r){const t=d/r;c=(t>.3&&t<.7&&hq%4==0)?[":",[200,80,110]]:[t<.45?"0":(hq%2?"o":"O"),shade(color,1-.25*t)]}}
else if(d<=Rr){if(d<.28*Rr)c=["@",[120,70,45]];else if(d<.42*Rr)c=["%",[210,160,60]];else if(Math.abs(Math.sin(9*a))>.45)c=[d>.85*Rr?"o":"0",shade(color,.8+.2*d/Rr)]}
if(c)pts.push([d/(Rr+1),u,v,c[0],c[1],mix(shade(c[1],.55),GREENS[0],.3)])}

class Scene{
constructor(n){this.stems=[];this.flowers=[];this.rib=[];this.spk=[];const spots=[];

for(let i=0;i<n;i++){let best=null,bd=-1;
for(let k=0;k<40;k++){const phi=rnd(0,2*PI),th=rnd(.08,.95),L=rnd(13,27)*(1-.18*th),hz=L*Math.sin(th)*1.1,

if(bd>6.8)spots.push(best)}
const order=spots.map((_,i)=>i).sort(()=>R()-.5);
spots.forEach((s,idx)=>{const start=order[idx]*2,tip=s.tip,pts=bez([0,0,0],[tip[0]*.45,tip[1]*.6,tip[2]*.45],tip,Math.max(8,s.L*1.1*2.4|0)),leaves=[];
for(let i=3;i<pts.length-6;i++)if(R()<.05){const psi=rnd(0,2*PI),dx=Math.cos(psi),dz=Math.sin(psi);
for(let j=1;j<4;j++)leaves.push([i,[pts[i][0]+dx*j*.9,pts[i][1]-j*.35,pts[i][2]+dz*j*.9],pick("~'`"),pick(GREENS)])}
this.stems.push({pts,color:pick(GREENS),leaves,start});
// the first CFG.pinkLilies flowers are pink lilies; the rest are a random mix
const pinkL=idx<CFG.pinkLilies;
const kind=pinkL?"lily":pick([..."cccclllggg"].map(x=>({c:"carnation",l:"lily",g:"gerbera"})[x]));
const Rr={carnation:rnd(2.4,3.4),lily:rnd(4,5.2),gerbera:rnd(3.4,4.4)}[kind];
const nv=norm([Math.cos(s.phi)*.85,.55,Math.sin(s.phi)*.85]),e1=norm(cross([0,1,0],nv)),e2=cross(nv,e1),h=head(kind,Rr,pinkL?pick(PINKLILY):pick(PAL[kind]));
this.flowers.push({c:tip,n:nv,e1,e2,pts:h,rhos:h.map(p=>p[0]),start})});
this.intro=Math.max(0,...this.flowers.map(f=>f.start))+STEM+BLOOM;
for(let i=0;i<40;i++){const a=2*PI*i/40;this.rib.push([2.6*Math.cos(a),3.5,2.6*Math.sin(a)])}
for(let i=0;i<45;i++){const an=rnd(0,2*PI),r=rnd(6,26);this.spk.push([[r*Math.cos(an),rnd(4,36),r*Math.sin(an)],pick(".*+"),pick(SPK),R()*12|0])}}
frame(t,yaw,pitch){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),buf=new Array(W*H);
const put=(px,py,z,ch,col)=>{const x=Math.round(px),y=Math.round(py);if(x<0||x>=W||y<0||y>=H)return;const o=buf[y*W+x];if(!o||z<o[0])buf[y*W+x]=[z,ch,col]};
const rot=(x0,y0,z0)=>{const x=x0*cy+z0*sy,z1=-x0*sy+z0*cy;return[x,y0*cp+z1*sp,z1*cp-y0*sp]};
const view=p=>rot(p[0],p[1]-MID,p[2]);
const proj=p=>{const[x,y,z]=view(p),s=D/(D+z);return[SX+2*x*s,SY-y*s,z]};

const pr=st.pts.slice(0,cnt).map(proj);
for(let i=0;i<cnt;i++){const[px,py,z]=pr[i],j=i+1<cnt?i+1:i-1;let vx=(pr[j][0]-px)/2,vy=pr[j][1]-py;if(j<i){vx=-vx;vy=-vy}
const ch=Math.abs(vx)<.4*Math.abs(vy)?"|:!;"[(i>>1)%4]:Math.abs(vy)<.4*Math.abs(vx)?"-":(vx*vy>0?"\\":"/");put(px,py,z,ch,st.color)}
for(const[i,p,ch,col]of st.leaves)if(i<cnt){const q=proj(p);put(q[0],q[1],q[2],ch,col)}}
for(const f of this.flowers){const age=t-f.start-STEM;if(age<=0)continue;let s=Math.min(1,age/BLOOM);s=s*s*(3-2*s);
let nmax=0;while(nmax<f.rhos.length&&f.rhos[nmax]<=s)nmax++;

for(let i=0;i<nmax;i++){const[,u,v,ch,col,bc]=f.pts[i],x=cx+u*e1[0]+v*e2[0],y=cy2+u*e1[1]+v*e2[1],z=cz+u*e1[2]+v*e2[2],sc=D/(D+z);
put(SX+2*x*sc,SY-y*sc,z,ch,front?col:bc)}}
if(t>=8)for(const p of this.rib){const q=proj(p);put(q[0],q[1],q[2],"=",RIB)}
if(t>=this.intro)for(const[p,ch,col,ph]of this.spk)if((t+ph)%12<9){const q=proj(p);put(q[0],q[1],q[2],ch,col)}
const g=new Array(W*H);buf.forEach((o,i)=>{g[i]=[o[1],shade(o[2],cl(.85-o[0]*.011,.45,1.1))]});return g}}
// ---- camera overlay ----
const CAM=(()=>{const iw=30,top=["        .-------.      ___      ","  _____/  [EVF]  \\____|(*)|__   "],
body=["  SONY                    [o] ","       .-\"\"\"\"\"\"\"-.            ","      /  .-----.  \\    a7C    ","     |  /  @@@  \\  |    II    ","     |  | @@@@@ |  |          ","     |  \\  @@@  /  |          ","      \\  '-----'  /           ","       '-.______.-'           "];

const BEAR=[" _           _ ","(_)_________(_)"," /           \\ ","|   o     o   |","|     (@)     |","|    \\_w_/    |"," \\___________/ "].join("\n");
$("bear").textContent=BEAR;$("msg").textContent=CFG.msg;$("cap").textContent="bear and oopy co  *  "+CFG.msg;$("note").textContent=CFG.note;$("note").contentEditable=CFG.noteEditable;

const id=++typing;let i=0;(function step(){if(id!=typing||i>txt.length)return;p.textContent=txt.slice(0,i);i+=2;setTimeout(step,18)})()}
// ---- memory polaroids: the bouquet shot is polaroid #1, then CFG.photos ----
CFG.photos.forEach(p=>loadImg(p.src).then(im=>{p.img=im;if(state=="photo"&&deck[di]===p)renderDeck()})); // p.img: undefined = loading, null = file not found
let deck=[],di=0,curNote="",snapCv=null,busy=false;
function cover(x,img,w,h){const s=Math.max(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}
function renderDeck(){deck=[{snap:true},...CFG.photos];const it=deck[di],pc=$("ph"),x=pc.getContext("2d"),w=pc.width,h=pc.height;
x.fillStyle="#1e1822";x.fillRect(0,0,w,h);
if(it.snap){if(snapCv)x.drawImage(snapCv,0,0)}
else if(it.img)cover(x,it.img,w,h);
else{x.fillStyle="#8a7f8c";x.font='22px "Courier New",monospace';x.textAlign="center";x.textBaseline="middle";x.fillText(it.img===null?"can't find "+it.src:"loading...",w/2,h/2)}
$("cap").textContent=it.snap?"bear and oopy co  *  "+CFG.msg:[it.caption,it.date].filter(Boolean).join("  *  ");
curNote=it.snap?CFG.note:(it.note||"");$("note").textContent=curNote;
$("postit").style.display=(curNote.trim()||CFG.noteEditable)?"":"none";
$("deckrow").style.display=deck.length>1?"flex":"none";$("count").textContent=(di+1)+" / "+deck.length}
function deckGo(dir){const n=CFG.photos.length+1;if(n<2||busy)return;busy=true;const pol=$("pol"),to=(di+dir+n)%n,swap=()=>{di=to;renderDeck()};
if(!pol.animate||matchMedia("(prefers-reduced-motion: reduce)").matches){swap();busy=false;return}
pol.animate([{transform:"none",opacity:1},{transform:`translateX(${-50*dir}px) rotate(${-4*dir}deg)`,opacity:0}],{duration:150,easing:"ease-in"}).onfinish=()=>{swap();
pol.animate([{transform:`translateX(${50*dir}px) rotate(${4*dir}deg)`,opacity:0},{transform:"none",opacity:1}],{duration:220,easing:"ease-out"}).onfinish=()=>busy=false}}
$("prev").onclick=()=>deckGo(-1);$("nxt").onclick=()=>deckGo(1);
let sw=null;$("pol").addEventListener("pointerdown",e=>sw=e.clientX);
addEventListener("pointerup",e=>{if(sw!=null&&state=="photo"){const d=e.clientX-sw;if(Math.abs(d)>50)deckGo(d<0?1:-1)}sw=null}); // swipe on a phone
function snap(){const f=$("flash");f.style.opacity=1;setTimeout(()=>f.style.opacity=0,120);
setTimeout(()=>{const g=scene.frame(t,yaw,pitch);draw(g,null);
snapCv=document.createElement("canvas");snapCv.width=756;snapCv.height=594;const x=snapCv.getContext("2d");
if(userPhoto)cover(x,userPhoto,756,594);else x.drawImage(cv,8*CW,1*CH,84*CW,33*CH,0,0,756,594);
draw(g,null,.25); // dim the bouquet behind the polaroid + note so they stand out
di=0;renderDeck();show("photo")},320)}
// ---- lock screen ----
const LK=CFG.lock,PADLOCK=String.raw`     .-""""""-.     
    /  .----.  \    
   |  /      \  |   
   |  |      |  |   
 .-'--'------'--'-. 
 |       __       | 
 |      (__)      | 
 |       ||       | 
 '----------------' `;
$("padlock").textContent=PADLOCK;$("lq").textContent=LK.question;
const nrm=v=>String(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
let tries=0;
function tryUnlock(){const v=nrm($("ans").value),a=$("ans");
if(v&&LK.answers.some(x=>nrm(x)==v)){$("lockmsg").textContent=LK.right;a.disabled=true;setTimeout(()=>show("grow"),700);return}
tries++;$("lockmsg").textContent=LK.wrong;a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");
if(tries>=2&&LK.hint)$("hintbtn").style.display="inline-block"}
$("unlock").onclick=tryUnlock;$("ans").onkeydown=e=>{if(e.key=="Enter")tryUnlock()};$("hintbtn").onclick=()=>$("lockmsg").textContent=LK.hint;
// ---- falling petals: little characters that sway down the stage (they start once the bouquet has grown) ----
const pcv=$("petals"),pctx=pcv.getContext("2d"),PETAL_COL=[[255,155,195],[255,125,175],[255,190,215],[250,235,240],[255,170,150],[210,170,255]],GLYPHS=["(",")","~","o","*","0"],pr=(a,b)=>a+Math.random()*(b-a);
let petals=[],petalsOn=CFG.petals&&!matchMedia("(prefers-reduced-motion: reduce)").matches,pw=900,ph=720,pdpr=1,plast=0;
function fitPetals(){const r=$("stage").getBoundingClientRect();pdpr=Math.min(typeof devicePixelRatio=="number"?devicePixelRatio:1,2);pw=r.width||900;ph=r.height||720;pcv.width=pw*pdpr;pcv.height=ph*pdpr;pctx.setTransform(pdpr,0,0,pdpr,0,0)}
fitPetals();addEventListener("resize",fitPetals);if(typeof ResizeObserver!="undefined")new ResizeObserver(fitPetals).observe($("stage"));
function newPetal(initial){const k=Math.max(.6,pw/900);return{x:pr(0,pw),y:initial?pr(-ph,0):-20,vy:pr(28,60)*k,sw:pr(12,40),sf:pr(.6,1.6),ph:pr(0,6.28),r:pr(0,6.28),rv:pr(-1.5,1.5),sz:pr(14,26)*Math.max(.7,k),g:pick(GLYPHS),c:pick(PETAL_COL),a:pr(.45,.85)}}
function petalLoop(ts){requestAnimationFrame(petalLoop);const dt=Math.min(.05,(ts-plast)/1000||0);plast=ts;
const allow=petalsOn&&state!="lock"&&state!="grow",target=Math.round(CFG.petalCount*Math.min(1,Math.max(.5,pw/900)));
while(allow&&petals.length<target)petals.push(newPetal(true));
pctx.clearRect(0,0,pw,ph);
petals=petals.filter(p=>{p.y+=p.vy*dt;p.r+=p.rv*dt;p.ph+=p.sf*dt;
if(p.y>ph+30){if(allow){Object.assign(p,newPetal(false));return true}return false} // recycle at the top, or let it go if petals are off
pctx.save();pctx.translate(p.x+Math.sin(p.ph)*p.sw,p.y);pctx.rotate(p.r);pctx.globalAlpha=p.a;pctx.fillStyle=rgb(p.c);
pctx.font=`${p.sz}px "Courier New",monospace`;pctx.textAlign="center";pctx.textBaseline="middle";pctx.fillText(p.g,0,0);pctx.restore();return true})}
$("petalbtn").textContent="petals: "+(petalsOn?"on":"off");
$("petalbtn").onclick=()=>{petalsOn=!petalsOn;$("petalbtn").textContent="petals: "+(petalsOn?"on":"off")};
// ---- music: the button slides the mp3 player open; browsers block autoplay, so she taps play herself ----
$("musicbtn").onclick=()=>{const m=$("music"),on=m.classList.toggle("on");$("musicbtn").textContent=on?"\u266A hide music":"\u266A music";if(on)setTimeout(()=>m.scrollIntoView({block:"nearest",behavior:"smooth"}),320)};
// ---- mp3 player ----
const au=$("aud"),BL=30,fmt=s=>isFinite(s)?(s/60|0)+":"+String(s%60|0).padStart(2,"0"):"0:00";
function mdraw(){const f=au.duration?au.currentTime/au.duration:0,n=Math.min(BL-1,Math.floor(f*BL));
$("mbar").textContent="["+"=".repeat(n)+"o"+"-".repeat(BL-1-n)+"]";$("mtime").textContent=fmt(au.currentTime)+" / "+fmt(au.duration)}
["timeupdate","loadedmetadata","durationchange"].forEach(ev=>au.addEventListener(ev,mdraw));
au.addEventListener("play",()=>$("mpp").innerHTML="&#10074;&#10074;");
au.addEventListener("pause",()=>$("mpp").innerHTML="&#9654;");
au.addEventListener("error",()=>$("mtitle").textContent="can't find song.mp3");
$("mpp").onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
$("mrs").onclick=()=>{au.currentTime=0;mdraw()};
$("mlp").onclick=()=>{au.loop=!au.loop;$("mlp").innerHTML="&#8635; loop: "+(au.loop?"on":"off")};
$("mmt").onclick=()=>{au.muted=!au.muted;$("mmt").innerHTML="&#9835; sound: "+(au.muted?"off":"on")};
$("mbar").onpointerdown=e=>{const r=$("mbar").getBoundingClientRect();if(au.duration){au.currentTime=cl((e.clientX-r.left)/r.width,0,1)*au.duration;mdraw()}};
mdraw();
// ---- save: polaroid + post-it as one picture ----
function wrap(c,text,maxW){const out=[];text.split("\n").forEach(par=>{let line="";par.split(/\s+/).forEach(w=>{const test=line?line+" "+w:w;if(c.measureText(test).width>maxW&&line){out.push(line);line=w}else line=test});out.push(line)});return out}
function exportCard(cb){const ph=$("ph"),pw=ph.width,hh=ph.height,note=curNote.trim(),pad=30,cardW=pw+pad*2,cardH=pad+hh+90,ns=300,
W2=pad+cardW+(note?40+ns+40:pad),H2=pad*2+cardH,c=document.createElement("canvas");c.width=W2;c.height=H2;const x=c.getContext("2d");
x.fillStyle="#14101a";x.fillRect(0,0,W2,H2);x.fillStyle="#faf7ee";x.fillRect(pad,pad,cardW,cardH);x.drawImage(ph,pad*2,pad*2);
x.fillStyle="#552d37";x.font='24px "Courier New",monospace';x.textAlign="center";x.textBaseline="middle";x.fillText($("cap").textContent,pad+cardW/2,pad*2+hh+45);
if(note){x.save();x.translate(pad+cardW+40+ns/2,pad+cardH/2);x.rotate(3*PI/180);
x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=18;x.shadowOffsetY=8;x.fillStyle="#fff59a";x.fillRect(-ns/2,-ns/2,ns,ns);x.shadowColor="transparent";
x.fillStyle="#4a3b1c";x.font='26px "Segoe Script","Bradley Hand","Marker Felt","Comic Sans MS",cursive';x.textAlign="left";x.textBaseline="top";
wrap(x,note,ns-40).slice(0,Math.floor((ns-40)/34)).forEach((l,i)=>x.fillText(l,-ns/2+20,-ns/2+20+i*34));x.restore()}
c.toBlob(cb)}
function key(k){if(k=="l")yaw+=.15,auto=false;else if(k=="r")yaw-=.15,auto=false;else if(k=="u")pitch=Math.min(1,pitch+.06);else if(k=="d")pitch=Math.max(-.15,pitch-.06);else if(k=="s")auto=!auto}
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
$("go").onclick=()=>state=="camera"?snap():state=="view"&&openLetter();
$("close").onclick=()=>show("view");$("cam").onclick=()=>show("camera");$("back").onclick=()=>show("view");
$("save").onclick=()=>{try{exportCard(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="wildflowers-"+(di+1)+".png";a.click()})}catch(e){alert("Right-click the photo to save it.")}};
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("[contenteditable=true],input"))return; // typing in a text box shouldn't turn the bouquet
if(state=="photo"){if(e.key=="ArrowLeft"){deckGo(-1);e.preventDefault()}else if(e.key=="ArrowRight"){deckGo(1);e.preventDefault()}return}
const m={ArrowLeft:"l",ArrowRight:"r",ArrowUp:"u",ArrowDown:"d",a:"l",d:"r",w:"u",s:"d"}[e.key];
if(m){key(m);e.preventDefault()}else if(e.key==" "){key("s");e.preventDefault()}else if(e.key=="Enter")$("go").click()});
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];auto=false};
addEventListener("pointerup",()=>drag=null);
addEventListener("pointermove",e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.01;pitch=cl(pitch+(e.clientY-drag[1])*.005,-.15,1);drag=[e.clientX,e.clientY]});
function loop(ts){requestAnimationFrame(loop);if(ts-last<1000/FPS)return;last=ts;
if(state=="grow"){yaw+=.035;if(++t>scene.intro)show("view")}
else if(state=="view"||state=="camera"){if(auto)yaw+=.03;t++}
else return;
draw(scene.frame(t,yaw,pitch),state=="camera"?CAMO:null)}
const locked=LK.enabled&&!Q.get("nolock");
show(locked?"lock":"grow");if(locked)setTimeout(()=>$("ans").focus(),150);requestAnimationFrame(loop);requestAnimationFrame(petalLoop);
</script></body></html>
